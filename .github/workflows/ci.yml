name: CI

on:
  push:
    branches: [main, redesign/v4]
  pull_request:
    branches: [main]

env:
  GEMINI_API_KEY: 'ci-dummy-gemini-key'
  RESEND_API_KEY: 'ci-dummy-resend-key'
  IP_HASH_SECRET: 'ci-dummy-hash-secret'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:contrast
      - run: npm run check:placeholders
      - run: npm run check:evidence
      - run: npm run check:citations
      - run: npm run check:links
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  lighthouse:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run lighthouse
