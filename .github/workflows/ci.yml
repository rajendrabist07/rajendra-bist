name: CI

on:
  push:
    branches: [main, redesign/v4]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RATE_LIMIT_DRIVER: memory
  NEXT_TELEMETRY_DISABLED: 1
  GEMINI_API_KEY: 'ci-dummy-gemini-key'
  RESEND_API_KEY: 'ci-dummy-resend-key'
  IP_HASH_SECRET: 'ci-dummy-hash-secret'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run typecheck
        run: npm run typecheck
      - name: Build Next.js application
        run: npm run build
      - name: Check contrast
        run: npm run check:contrast
      - name: Check placeholders
        run: npm run check:placeholders
      - name: Check evidence
        run: npm run check:evidence
      - name: Check citations
        run: npm run check:citations
      - name: Check links
        run: npm run check:links
      - name: Run unit & integration tests
        run: npm test
      - name: Report Failure Diagnostics
        if: failure()
        run: |
          echo "## ❌ Validate Job Failed" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Validate Job | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "::error title=Validation Failure::Validate job failed on commit ${{ github.sha }}"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js application
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Run Playwright E2E tests
        run: npm run test:e2e
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Report Failure Diagnostics
        if: failure()
        run: |
          echo "## ❌ Browser E2E Job Failed" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Browser Job | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "::error title=Browser Test Failure::Browser Playwright test suite failed on commit ${{ github.sha }}"

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js application
        run: npm run build
      - name: Run Lighthouse CI Audit
        run: npm run lighthouse
      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
      - name: Report Failure Diagnostics
        if: failure()
        run: |
          echo "## ❌ Lighthouse CI Job Failed" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse Job | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "::error title=Lighthouse CI Failure::Lighthouse CI audit threshold failed on commit ${{ github.sha }}"
