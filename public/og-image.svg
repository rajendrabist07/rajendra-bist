<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080806" />
      <stop offset="58%" stop-color="#15110e" />
      <stop offset="100%" stop-color="#211a15" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8f3f2" />
      <stop offset="52%" stop-color="#e0b9a6" />
      <stop offset="100%" stop-color="#b79a82" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative blurred circles -->
  <circle cx="150" cy="120" r="100" fill="rgba(232, 243, 242, 0.12)" filter="url(#blur)"/>
  <circle cx="1050" cy="550" r="120" fill="rgba(224, 185, 166, 0.14)" filter="url(#blur)"/>
  
  <!-- Main content -->
  <g>
    <!-- Name -->
    <text x="600" y="200" font-family="Inter, sans-serif" font-size="84" font-weight="700" fill="#fffaf3" text-anchor="middle">
      Rajendra Bist
    </text>
    
    <!-- Role with gradient -->
    <text x="600" y="310" font-family="Inter, sans-serif" font-size="56" font-weight="600" fill="url(#textGrad)" text-anchor="middle">
      Full-Stack Developer &amp; AI Systems Engineer
    </text>
    
    <!-- Tagline -->
    <text x="600" y="390" font-family="Inter, sans-serif" font-size="28" fill="#d8ccc0" text-anchor="middle">
      Scalable APIs. Database-driven products.
    </text>
    <text x="600" y="430" font-family="Inter, sans-serif" font-size="28" fill="#d8ccc0" text-anchor="middle">
      RAG pipelines and production AI integrations.
    </text>
    
    <!-- Tech stack footer -->
    <rect x="200" y="500" width="800" height="90" fill="rgba(255, 250, 243, 0.05)" stroke="rgba(224, 185, 166, 0.22)" rx="12"/>
    <text x="600" y="530" font-family="monospace" font-size="16" fill="#d8ccc0" text-anchor="middle">
      Next.js • Node.js • TypeScript • PostgreSQL
    </text>
    <text x="600" y="560" font-family="monospace" font-size="16" fill="#d8ccc0" text-anchor="middle">
      MongoDB • Supabase pgvector • Gemini • Groq
    </text>
  </g>
</svg>
