<svg width="960" height="600" viewBox="0 0 960 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sovBg" x1="0" y1="0" x2="960" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080806"/>
      <stop offset=".52" stop-color="#12141a"/>
      <stop offset="1" stop-color="#1a1e28"/>
    </linearGradient>
    <linearGradient id="sovTopGrad" x1="120" y1="74" x2="840" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset=".3" stop-color="#34D8B0"/>
      <stop offset=".7" stop-color="#FF7A33"/>
      <stop offset="1" stop-color="#FFA472"/>
    </linearGradient>
    <filter id="sovGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Panel Background & Border -->
  <rect width="960" height="600" rx="36" fill="url(#sovBg)"/>
  <rect x="1.5" y="1.5" width="957" height="597" rx="34.5" stroke="#38BDF8" stroke-opacity=".28" stroke-width="3"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="220" cy="180" r="160" fill="#38BDF8" fill-opacity=".12" filter="url(#sovGlow)"/>
  <circle cx="760" cy="460" r="180" fill="#FF7A33" fill-opacity=".10" filter="url(#sovGlow)"/>

  <!-- Top Accent Gradient Bar -->
  <rect x="120" y="74" width="720" height="24" rx="12" fill="url(#sovTopGrad)" opacity=".90"/>

  <!-- Header Typography -->
  <text x="72" y="162" fill="#EDEFF2" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.02em">Sovereign</text>
  <text x="72" y="204" fill="#8E97A3" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">Multi-tenant B2B SaaS for autonomous AI workflow agents</text>

  <!-- Architecture Flow Diagram -->
  <g transform="translate(140, 240)">
    <!-- Node 1: Turborepo / Org Context -->
    <rect x="0" y="20" width="180" height="150" rx="16" fill="#10131A" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
    <rect x="20" y="44" width="90" height="10" rx="5" fill="#38BDF8"/>
    <text x="20" y="74" fill="#EDEFF2" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Turborepo App</text>
    <text x="20" y="96" fill="#8E97A3" font-family="system-ui, sans-serif" font-size="11">Multi-tenant isolation</text>
    <rect x="20" y="118" width="78" height="22" rx="6" fill="rgba(56,189,248,0.15)" stroke="#38BDF8" stroke-width="1"/>
    <text x="59" y="133" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">RBAC + QUOTA</text>

    <!-- Connector 1 -->
    <path d="M180 95 L240 95" stroke="#34D8B0" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="240" cy="95" r="4" fill="#34D8B0"/>

    <!-- Node 2: Inngest Engine -->
    <rect x="240" y="20" width="200" height="150" rx="16" fill="#10131A" stroke="#34D8B0" stroke-width="2"/>
    <rect x="260" y="44" width="110" height="10" rx="5" fill="#34D8B0"/>
    <text x="260" y="74" fill="#EDEFF2" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Inngest Workflows</text>
    <text x="260" y="96" fill="#8E97A3" font-family="system-ui, sans-serif" font-size="11">Durable &amp; idempotent runs</text>
    <rect x="260" y="118" width="96" height="22" rx="6" fill="rgba(52,216,176,0.15)" stroke="#34D8B0" stroke-width="1"/>
    <text x="308" y="133" fill="#34D8B0" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">HUMAN-IN-THE-LOOP</text>

    <!-- Connector 2 -->
    <path d="M440 95 L500 95" stroke="#FF7A33" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="500" cy="95" r="4" fill="#FF7A33"/>

    <!-- Node 3: PostgreSQL RLS + Tool Loop -->
    <rect x="500" y="20" width="180" height="150" rx="16" fill="#10131A" stroke="#FF7A33" stroke-width="2"/>
    <rect x="520" y="44" width="90" height="10" rx="5" fill="#FF7A33"/>
    <text x="520" y="74" fill="#EDEFF2" font-family="ui-monospace, monospace" font-size="12" font-weight="700">PostgreSQL (RLS)</text>
    <text x="520" y="96" fill="#8E97A3" font-family="system-ui, sans-serif" font-size="11">DB-level tenant boundary</text>
    <rect x="520" y="118" width="90" height="22" rx="6" fill="rgba(255,122,51,0.15)" stroke="#FF7A33" stroke-width="1"/>
    <text x="565" y="133" fill="#FF7A33" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">ZOD TOOL LOOP</text>
  </g>

  <!-- Bottom Metric Badges -->
  <g transform="translate(140, 480)">
    <rect x="0" y="0" width="180" height="38" rx="8" fill="#121620" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="90" y="24" fill="#EDEFF2" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">POSTGRES RLS ISOLATION</text>

    <rect x="240" y="0" width="200" height="38" rx="8" fill="#121620" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="340" y="24" fill="#EDEFF2" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">INNGEST RESUMABLE RUNS</text>

    <rect x="500" y="0" width="180" height="38" rx="8" fill="#121620" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="590" y="24" fill="#EDEFF2" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">ZOD UNTRUSTED LLM GUARD</text>
  </g>
</svg>
