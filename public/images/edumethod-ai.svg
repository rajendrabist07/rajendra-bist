  <text x="206" y="254" fill="#6EE7B7" font-family="Inter, Arial, sans-serif" font-size="11">Multimodal photo scan complete</text>

  <!-- Day 2: In Progress -->
  <rect x="146" y="290" width="262" height="66" rx="18" fill="#1E2A4F" fill-opacity="0.4" stroke="#6366F1" stroke-width="1.5"/>
