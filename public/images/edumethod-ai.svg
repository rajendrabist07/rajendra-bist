  <text x="500" y="395" fill="#E2E8F0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Absolutely. Starting adaptive quiz on</text>
  <text x="500" y="412" fill="#E2E8F0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Spaced Repetition &amp; Interleaving...</text>
  <text x="500" y="429" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="11">EduMethod AI Coach • Just now</text>

