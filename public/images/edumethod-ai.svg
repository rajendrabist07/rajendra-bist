  <path d="M432 290C440 280 445 285 456 295" stroke="#A855F7" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/>
  <path d="M432 323C442 323 446 323 456 323" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/>

